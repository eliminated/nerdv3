name: CI

on:
  push:

# One command per step throughout: GitHub Actions pwsh propagates only the
# last command's exit code from a multi-line run block (V2-verified).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      # *.g.dart is gitignored by design, so codegen must precede analyze/test.
      - name: Generate code
        run: dart run build_runner build
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Re-dump schema
        run: dart run drift_dev schema dump lib/core/db/database.dart drift_schemas/
      # intent-to-add makes a NEW dump file (schemaVersion bump) visible to
      # git diff, which otherwise only reports tracked paths (V2-verified hole).
      - name: Register untracked files so diff can see new dump versions
        run: git add --intent-to-add .
      - name: Fail on schema drift
        run: git diff --exit-code -- drift_schemas
      # A coordinated regeneration (edit tables + re-dump + regenerate the test
      # helper) passes both guards above. Frozen snapshots must never change on
      # a branch: compare against main directly. --diff-filter=MD fails only on
      # modified/deleted snapshots — NEW dump files (a schemaVersion bump, or
      # this guard's own bootstrap) are additive and allowed.
      - name: Fetch main for the freeze comparison
        run: git fetch origin main
      - name: Fail if a frozen schema snapshot was rewritten or removed
        run: git diff --exit-code --diff-filter=MD origin/main -- drift_schemas
      # V3 note (2026-07-27): the Flutter app is retired to reference status, but
      # its suite is the behavioural specification the Electron rewrite must
      # reproduce, so it keeps running until the desktop suite replaces it.
      # The schema guards below still protect the frozen v1 that the rewrite ports.

  # The Electron rewrite's correctness core (slice V3-A). Independent of the
  # Flutter job on purpose: the two must be able to go red separately, and the
  # reference job retires once V3-D proves parity.
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      # Pinned exactly, as Flutter is. node:sqlite is why the floor is Node 25 —
      # it is what lets core open a database with no native module and no MSVC
      # step. If a future Electron target lacks it, better-sqlite3 is the
      # recorded fallback and only src/db/driver.ts changes.
      - uses: actions/setup-node@v4
        with:
          node-version: '25.7.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
